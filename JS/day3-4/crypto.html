
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crypto Pulse</title>

    <!-- Bootstrap 5.3.3 (MIT License) -->
    <!-- CDN 파일 무결성 검증 적용 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="crypto.css">
</head>

<body>

    <div class="container py-5">

        <!-- 상단 배너 -->
        <header class="hero rounded-4 p-4 mb-4">

            <p class="hero-label mb-2">
                REAL-TIME MARKET TRACKER
            </p>

            <h1 class="display-5 fw-bold">
                Crypto Pulse
            </h1>

            <p class="mb-0">
                Explore the market in real time.
            </p>

        </header>


        <!-- 탭 버튼 및 검색창 -->
        <div class="d-flex flex-wrap justify-content-between
                    align-items-center gap-3 mb-4">

            <div class="d-flex gap-2">

                <button id="allBtn"
                        type="button"
                        class="btn market-btn rounded-pill active">
                    All Markets
                </button>

                <button id="favoriteBtn"
                        type="button"
                        class="btn market-btn rounded-pill">
                    ★ Watchlist
                </button>

            </div>

            <!-- API 연결 상태 표시 -->
            <span id="apiStatus"
                  class="refresh-text"
                  role="status">
                Connecting...
            </span>

            <!-- 검색창 -->
            <input type="text"
                   id="searchInput"
                   class="form-control rounded-pill"
                   aria-label="Search cryptocurrency"
                   placeholder="Search cryptocurrency...">

        </div>


        <!-- 암호화폐 테이블 -->
        <div class="glass-panel rounded-4 p-3">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead>
                        <tr>
                            <th>Favorite</th>
                            <th>Symbol</th>
                            <th>Price (USDT)</th>
                            <th>24h Change</th>
                            <th>24h High</th>
                            <th>24h Low</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- JavaScript로 데이터 추가 -->
                    </tbody>

                </table>

            </div>

        </div>


        <!-- 하단 정보 -->
        <footer class="mt-4">

            <div class="d-flex flex-wrap
                        justify-content-between gap-2">

                <small>Powered by Binance API</small>
                <small>USDT Markets</small>

            </div>

            <p class="mt-3 mb-0">
                <small>
                    Educational project only.
                    Not financial or investment advice.
                </small>
            </p>

        </footer>

    </div>

    <!-- JavaScript 연결 -->
    <script src="crypto.js"></script>

</body>

</html>
