<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제_콘솔창계산기</title>
</head>
<body>
    <h1>계산을 시작해 보시겠습니까</h1>

    <h3>윈도우(Windows OS) 유저 일 경우:</h3>
    <hr>
    <p>1. F12 키를 눌러 개발자 도구를 연 뒤 Console을 선택하세요</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행하세요</p>


    <h3>맥(Mac OS) 유저 일 경우:</h3>
    <hr>
    <p>1. Option + Cmd + I 키를 눌러 개발자 도구를 연 뒤 Console을 선택하세요</p>
    <p>2. start()를 콘솔창에 입력하여 계산기를 실행하세요</p>

    <script src="calculator.js"></script>


</body>
</html>
